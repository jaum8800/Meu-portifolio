<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato | João Vitor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formulario.css">
</head>
<body class="interna">

<div class="scroll-progress"></div>
<canvas id="code-rain"></canvas>
<div class="float-icons"></div>

<a href="index.html" class="btn-voltar" aria-label="Voltar para a tela inicial">
  <span class="seta">&larr;</span> Voltar
</a>

<header>
  <h1>Contato</h1>
  <p>Envie uma mensagem</p>
</header>

<section class="painel reveal" data-tilt>
  <h2>Fale comigo</h2>

  <form class="form-contato" method="get">

    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome">
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com">
    </div>

    <div class="campo">
      <label for="assunto">Assunto</label>
      <input type="text" id="assunto" name="assunto" placeholder="Sobre o que você quer falar">
    </div>

    <div class="campo">
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5"
                placeholder="Escreva sua mensagem"></textarea>
    </div>

    <button type="submit">Enviar</button>

  </form>
</section>

<footer>
  2026. Feito por João Vitor
</footer>

<script src="js/animacoes.js"></script>
<script>
  document.getElementById('email').addEventListener('input', function () {
    this.value = this.value.replace(/\s+/g, '').toLowerCase();
  });
</script>

</body>
</html>
